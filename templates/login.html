{% extends "base.html" %}

{% block title %}Sign in · Server Monitor{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <p class="lede">Shared admin account. Username is admin.</p>
  {% if error %}
  <p class="banner" role="alert">{{ error }}</p>
  {% endif %}
  <form class="stack" action="{{ url_for('login') }}" method="post" autocomplete="off">
    <label>
      Username
      <input type="text" name="username" value="admin" autocomplete="username" required>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
